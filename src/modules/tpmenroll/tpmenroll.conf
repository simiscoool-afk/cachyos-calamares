#
# TPM Enrollment module configuration
#
# This module enrolls LUKS2 partitions with TPM2 for automatic unlock using
# systemd-cryptenroll. It runs after partitions are created but before the
# bootloader is configured.
---

# TPM2 PCR indexes to bind to (comma-separated)
# Empty means no PCR binding (default for non-Secure Boot systems)
# PCR 7 = Secure Boot state, PCR 0 = firmware, PCR 4 = boot manager
#
# For systems with Secure Boot enabled, consider using: "7"
# For systems without Secure Boot, leave empty or omit
#
tpmPcrs: ""
